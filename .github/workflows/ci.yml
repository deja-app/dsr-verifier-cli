name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Pinned version is always tested first; other versions catch
        # any forward-compatibility issues before they become blockers.
        go: ['1.22.3', '1.23.x']
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Verify module integrity
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Vector parity (vendored copy byte-identical to wallow authoritative)
        # Asserts the vendored copy of rv-canonical-vector.json is byte-identical
        # to docs/dsr/rv-canonical-vector.json in the wallow monorepo.
        # The file SHA-256 below is computed from the wallow authoritative copy;
        # update it here whenever you update the wallow source, and update the
        # CLI's CanonicalPayload(RV) accordingly so the Go golden tests still pass.
        # When both repos are available locally: make verify-vector-parity WALLOW_REPO=<path>
        run: |
          EXPECTED="cb4f13d2a9eb6667e01089321c9553812615c2866231e2410d550949c26b13d6"
          ACTUAL=$(sha256sum testdata/protocol/rv-canonical-vector.json | awk '{print $1}')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "RV vector file SHA-256 mismatch — vendored copy has drifted from wallow authoritative"
            echo "  expected (wallow): $EXPECTED"
            echo "  actual  (cli):     $ACTUAL"
            echo "  Fix: copy docs/dsr/rv-canonical-vector.json from wallow, update rvCanonical() in the CLI, and update this hash."
            exit 1
          fi
          echo "vector-parity OK (cb4f13d2)"

      - name: Test
        run: go test -race -count=1 -timeout=120s ./...

      - name: Build (host platform)
        run: |
          go build \
            -trimpath \
            -buildvcs=false \
            -ldflags="-s -w -X github.com/deja-app/dsr-verifier-cli/internal/cli.BuildCommit=$(git rev-parse --short HEAD)" \
            ./cmd/dsr-verifier-cli

  # ── Cross-implementation parity matrix ──────────────────────────────────────
  # Runs every receipt type × canonical form version through BOTH the TypeScript
  # issuer (in the wallow monorepo) and the Go verifier (this repo).
  # Any byte difference in canonical form is caught here as a signature failure.
  #
  # The workflow:
  #   1. Check out BOTH repos side-by-side.
  #   2. Run the TypeScript generator (packages/api/scripts/generate-parity-vectors.ts)
  #      to produce fresh signed vectors in a temp directory.
  #   3. Diff against the committed vectors — any drift fails the job.
  #   4. Run `go test ./internal/verify/ -run TestParityMatrix` to verify all
  #      committed vectors pass signature verification in Go.
  #
  # This catches three classes of bug:
  #   A. Canonical byte drift (Go != TypeScript for the same receipt type).
  #   B. Stale committed vectors (generator updated but vectors not regenerated).
  #   C. Regression in either implementation that breaks existing vectors.
  parity-matrix:
    name: Cross-implementation parity matrix
    runs-on: ubuntu-latest
    steps:
      - name: Check out dsr-verifier-cli
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          path: dsr-verifier-cli

      - name: Check out wallow
        uses: actions/checkout@v4
        with:
          repository: BeWallow/wallow
          path: wallow
          # The wallow repo contains the TypeScript canonical form functions.
          # Use a deploy key or PAT if the repo is private.
          token: ${{ secrets.WALLOW_READ_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.3'
          cache: true
          cache-dependency-path: dsr-verifier-cli/go.sum

      - uses: pnpm/action-setup@v4
        with:
          version: '9.1.0'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: wallow/pnpm-lock.yaml

      - name: Install wallow dependencies
        run: cd wallow && pnpm install --frozen-lockfile

      - name: Generate parity vectors (TypeScript issuer)
        run: |
          cd wallow/packages/api
          pnpm exec tsx scripts/generate-parity-vectors.ts \
            --out-dir ${{ github.workspace }}/parity-fresh

      - name: Check parity drift (committed vectors must be up-to-date)
        run: |
          diff -rq \
            ${{ github.workspace }}/parity-fresh \
            ${{ github.workspace }}/dsr-verifier-cli/internal/verify/testdata/parity || (
            echo ""
            echo "ERROR: committed parity vectors are stale or differ from the TypeScript issuer."
            echo "Regenerate: cd dsr-verifier-cli && make generate-parity-vectors WALLOW_REPO=../wallow"
            echo "Then commit the updated vectors and re-run this job."
            exit 1
          )
          echo "parity-drift OK — committed vectors match TypeScript issuer output"

      - name: Verify parity matrix in Go
        run: |
          cd dsr-verifier-cli
          go test -v -count=1 -run 'TestParityMatrix' ./internal/verify/

  cross-compile:
    name: Cross-compile (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
    env:
      CGO_ENABLED: '0'
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.3'
          cache: true

      - name: Build
        run: |
          EXT=""
          [ "$GOOS" = "windows" ] && EXT=".exe"
          go build \
            -trimpath \
            -buildvcs=false \
            -ldflags="-s -w -X github.com/deja-app/dsr-verifier-cli/internal/cli.BuildCommit=$(git rev-parse --short HEAD)" \
            -o "dsr-verifier-cli${EXT}" \
            ./cmd/dsr-verifier-cli
